# Size thresholds in bytes for binary size regression tracking
#
# Semantics:
#   - All values are byte counts (not MB, not KiB). The comments below show the
#     equivalent size in MB using 1 MB = 1024 * 1024 bytes.
#   - MAX_GO_SIZE applies to every Go artifact checked by
#     scripts/check_binary_size.sh. Any Go binary whose size exceeds this value
#     is reported as a regression.
#   - MAX_RUST_SIZE applies to the Rust simulator artifact checked by
#     scripts/check_binary_size.sh. A Rust simulator binary whose size exceeds
#     this value is reported as a regression.
#
# Updating budgets after an intentional size change:
#   1. Confirm the size increase is expected and justified (e.g. new feature or
#      dependency) rather than an accidental regression.
#   2. Update the relevant value below to the new byte budget, keeping the
#      "bytes = MB * 1024 * 1024" relationship and the MB comment in sync.
#   3. Re-run scripts/check_binary_size.sh to verify the new budget passes.
#
# 30 MB (30 * 1024 * 1024)
MAX_GO_SIZE=31457280

# 20 MB (20 * 1024 * 1024)
MAX_RUST_SIZE=20971520